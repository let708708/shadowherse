<!doctype html>
<meta charset="utf-8">
<title>sound test</title>
<pre id="out">running</pre>
<p>手元で聴くとき：このページを開いて画面をタップすると、効果音と3曲を順に鳴らします。</p>
<script type="module">
// 効果音と BGM をすべて鳴らし、エラーが出ないか確かめる
import { initAudio, se, bgm } from "../js/sound.js";
const out = document.getElementById("out");
const errors = [];
window.addEventListener("error", (e) => errors.push(e.message));
const origErr = console.error;
console.error = (...a) => { errors.push(a.join(" ")); origErr(...a); };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const names = ["tap", "select", "summon", "spell", "hit", "hitLeader", "death", "heal", "buff", "draw", "shuffle", "myTurn", "turn", "error", "start", "win", "lose"];

async function run() {
  const log = [];
  for (const n of names) { se(n); log.push(n); await wait(700); }
  for (const s of ["menu", "battle", "pinch", "battle", null]) { bgm(s); log.push("bgm " + s); await wait(4000); }
  out.textContent = "DONE played=" + log.length + "\nerrors=" + JSON.stringify(errors);
}

initAudio();
let started = false;
const go = () => { if (started) return; started = true; run().catch((e) => { errors.push("RUN " + e.message); out.textContent = "DONE errors=" + JSON.stringify(errors); }); };
document.addEventListener("pointerdown", () => setTimeout(go, 50));
// 自動テスト用：タップの代わり
if (location.search.includes("auto")) setTimeout(() => document.dispatchEvent(new PointerEvent("pointerdown")), 100);
</script>
